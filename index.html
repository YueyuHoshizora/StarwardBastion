<body>
  <div id="app">
    <nav class="language-switch" data-i18n-aria-label="ui.language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="ko">한국어</button>
    </nav>
    <!-- 首頁 -->
    <section id="screen-title" class="screen active" data-i18n-aria-label="ui.home">
      <div class="title-box">
        <h1 data-i18n="ui.brand">星域防線</h1>
        <p class="lead" data-i18n="ui.lead">守衛人類星際殖民地的能源核心，阻止機械群沿地表通道與空中航道進攻。</p>
        <button id="btn-start" class="primary big" data-i18n="ui.start">開始遊戲</button>
        <p id="audio-hint" class="audio-hint" data-i18n="ui.audioHint">🔈 點擊任意處或按任意鍵開啟音樂與音效</p>
        <div class="vol-row">
          <span class="vol"><button class="toggle" data-audio="music" aria-pressed="true">♪ <span data-i18n="ui.music">音樂</span></button><input type="range" min="0" max="100" step="5" data-vol="music" data-i18n-aria-label="ui.musicVolume"></span>
          <span class="vol"><button class="toggle" data-audio="sfx" aria-pressed="true">🔊 <span data-i18n="ui.sfx">音效</span></button><input type="range" min="0" max="100" step="5" data-vol="sfx" data-i18n-aria-label="ui.sfxVolume"></span>
        </div>
        <ul class="keys">
          <li><kbd>1</kbd>–<kbd>0</kbd> <kbd>-</kbd> <kbd>=</kbd> <span data-i18n="ui.selectTower">選塔</span></li>
          <li><kbd>Esc</kbd> <span data-i18n="ui.cancel">取消</span></li>
          <li><kbd>Space</kbd> <span data-i18n="ui.nextWave">開始下一波</span></li>
          <li><kbd>P</kbd> <span data-i18n="ui.pause">暫停</span></li>
          <li><kbd>F</kbd> <span data-i18n="ui.speed">倍速</span></li>
          <li><kbd>M</kbd> <span data-i18n="ui.music">音樂</span></li>
          <li><kbd>N</kbd> <span data-i18n="ui.sfx">音效</span></li>
        </ul>
        <p class="install-row"><button id="btn-install" class="ghost" data-i18n="ui.install" hidden>安裝為應用程式</button><span id="offline-state"></span></p>
      </div>
    </section>
    <!-- 地圖選擇 -->
    <section id="screen-select" class="screen" data-i18n-aria-label="ui.mapSelect">
      <header class="select-head">
        <h2 data-i18n="ui.chooseMap">選擇地圖</h2>
        <div class="select-tools">
          <span class="vol"><button class="toggle" data-audio="music" aria-pressed="true">♪ <span data-i18n="ui.music">音樂</span></button><input type="range" min="0" max="100" step="5" data-vol="music" data-i18n-aria-label="ui.musicVolume"></span>
          <span class="vol"><button class="toggle" data-audio="sfx" aria-pressed="true">🔊 <span data-i18n="ui.sfx">音效</span></button><input type="range" min="0" max="100" step="5" data-vol="sfx" data-i18n-aria-label="ui.sfxVolume"></span>
        </div>
      </header>
      <div id="map-grid" class="map-grid"></div>
    </section>
    <!-- 對局 -->
    <section id="screen-game" class="screen" data-i18n-aria-label="ui.game">
      <header class="topbar">
        <div class="tb-map"><b id="hud-map"></b> <span id="hud-star" class="stars"></span></div>
        <div class="tb-stat" data-i18n-title="ui.wavesTitle"><span class="lbl" data-i18n="ui.wavesTitle">波次</span><b id="hud-wave">0/20</b></div>
        <div class="tb-stat" data-i18n-title="ui.baseTitle"><span class="lbl" data-i18n="ui.baseTitle">♥ 基地</span><b id="hud-hp">20</b></div>
        <div class="tb-stat" data-i18n-title="ui.resourcesTitle"><span class="lbl">CR</span><b id="hud-cr">500</b></div>
        <div class="tb-speed" role="group" data-i18n-aria-label="ui.speed">
          <span class="lbl" data-i18n="ui.speed">速度</span><b id="hud-speed">1×</b>
          <button data-speed="pause" data-i18n-title="ui.pauseResume">⏸</button>
          <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
        </div>
        <div class="tb-audio">
          <span class="vol"><button class="toggle" data-audio="music" aria-pressed="true">♪</button><input type="range" min="0" max="100" step="5" data-vol="music" data-i18n-aria-label="ui.musicVolume"></span>
          <span class="vol"><button class="toggle" data-audio="sfx" aria-pressed="true">🔊</button><input type="range" min="0" max="100" step="5" data-vol="sfx" data-i18n-aria-label="ui.sfxVolume"></span>
        </div>
        <button id="btn-wave" class="primary" data-i18n-title="ui.startNextWave">開始下一波</button>
        <button id="btn-maps" class="ghost" data-i18n-title="ui.mapButton" data-i18n="ui.mapButton">地圖</button>
      </header>
      <main class="field-wrap">
        <div id="field" class="field"><canvas id="battle"></canvas><div id="banner" class="banner" hidden></div></div>
        <aside class="side">
          <div id="tower-grid" class="tower-grid" role="listbox" data-i18n-aria-label="ui.towerMenu"></div>
          <div id="info" class="info" aria-live="polite"></div>
        </aside>
      </main>
      <div id="result" class="result" hidden>
        <div class="result-box">
          <canvas id="card-preview" width="1200" height="675"></canvas>
          <div class="result-side">
            <h2 id="result-title"></h2><dl id="result-stats"></dl>
            <p id="result-error" class="error" role="alert" hidden></p>
            <div class="result-actions">
              <button id="btn-download" class="primary" data-i18n="ui.downloadCard">下載戰果分享卡</button>
              <button id="btn-restart" data-i18n="ui.restart">重新開始</button>
              <button id="btn-back" data-i18n="ui.backMaps">返回地圖選擇</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </div>
