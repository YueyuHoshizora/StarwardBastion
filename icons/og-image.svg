<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>星域防線 Starward Bastion 分享圖</title>
  <defs>
    <radialGradient id="bg" cx="70%" cy="45%" r="85%">
      <stop offset="0" stop-color="#1b2d55"/>
      <stop offset="1" stop-color="#060a14"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#8fe8ff"/>
      <stop offset="1" stop-color="#1d8fd0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="1" stop-color="#c59bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="34" height="34" fill="#16223d" stroke="#223459" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 俯視戰場：可建塔格 -->
  <g opacity="0.9">
    <rect x="640" y="40" width="520" height="560" rx="12" fill="url(#grid)"/>
  </g>
  <!-- 地面道路 -->
  <path d="M640 140 L1000 140 L1000 300 L760 300 L760 460 L900 460" fill="none" stroke="#9fb0d0" stroke-width="44" stroke-linejoin="miter"/>
  <path d="M640 140 L1000 140 L1000 300 L760 300 L760 460 L900 460" fill="none" stroke="#35425f" stroke-width="36" stroke-linejoin="miter"/>
  <g fill="none" stroke="#56688e" stroke-width="5">
    <path d="M700 128 l12 12 -12 12"/><path d="M800 128 l12 12 -12 12"/><path d="M900 128 l12 12 -12 12"/>
    <path d="M880 288 l-12 12 12 12"/><path d="M790 288 l-12 12 12 12"/>
  </g>
  <!-- 空中航道：懸空虛線＋投影 -->
  <path d="M1160 560 L1040 440 L900 460" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="10" stroke-dasharray="24 16" transform="translate(7 10)"/>
  <path d="M1160 560 L1040 440 L900 460" fill="none" stroke="#e9f3ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="24 16"/>
  <!-- 基地 -->
  <g transform="translate(930 460)">
    <polygon points="0,-62 53.7,-31 53.7,31 0,62 -53.7,31 -53.7,-31" fill="#0c1a2e" stroke="#8fe8ff" stroke-width="8"/>
    <circle r="30" fill="url(#core)"/>
  </g>
  <!-- 塔 -->
  <g transform="translate(880 220)">
    <rect x="-38" y="-38" width="76" height="76" rx="9" fill="#1b2336" stroke="#3a4a6a" stroke-width="3"/>
    <circle r="28" fill="#141a2b" stroke="#7fd3ff" stroke-width="5"/>
    <rect x="0" y="-6" width="36" height="12" rx="3" fill="#7fd3ff" transform="rotate(-90)"/>
    <circle r="10" fill="#7fd3ff"/>
  </g>
  <g transform="translate(1080 360)">
    <rect x="-38" y="-38" width="76" height="76" rx="9" fill="#1b2336" stroke="#3a4a6a" stroke-width="3"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2b" stroke="#ff9d5c" stroke-width="5"/>
    <circle r="16" fill="#05070d" stroke="#ff9d5c" stroke-width="5"/>
  </g>
  <g transform="translate(680 380)">
    <rect x="-38" y="-38" width="76" height="76" rx="9" fill="#1b2336" stroke="#3a4a6a" stroke-width="3"/>
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#c59bff" stroke-width="6"/>
    <circle cx="-27" r="7" fill="#f0e3ff"/><circle cx="27" r="7" fill="#f0e3ff"/><circle cy="-27" r="7" fill="#f0e3ff"/><circle cy="27" r="7" fill="#f0e3ff"/>
  </g>
  <!-- 敵人 -->
  <g transform="translate(720 140)"><circle r="14" fill="#e8ecf5" stroke="#0a0e18" stroke-width="3"/><circle cx="3" r="5" fill="#ff2a2a"/></g>
  <g transform="translate(960 140)"><rect x="-17" y="-17" width="34" height="34" rx="3" fill="#9aa6bd" stroke="#0a0e18" stroke-width="3"/></g>
  <g transform="translate(1100 500) rotate(-135)"><polygon points="14,0 -8,-11 -8,11" fill="#f5f08a" stroke="#0a0e18" stroke-width="3"/></g>
  <!-- 標題 -->
  <g font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif">
    <text x="70" y="250" font-size="104" font-weight="800" letter-spacing="14" fill="url(#title)">星域防線</text>
    <text x="74" y="316" font-size="36" font-weight="600" letter-spacing="6" fill="#93a1c4">STARWARD BASTION</text>
    <text x="74" y="400" font-size="28" fill="#e6ecff">未來科技俯視塔防・桌面瀏覽器</text>
    <text x="74" y="450" font-size="24" fill="#93a1c4">20 張地圖 ・ 12 種防禦塔 ・ 16 種敵人 ・ 20 首 8-bit 原創曲</text>
  </g>
</svg>
